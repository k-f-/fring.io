name: Brief Update Pipeline

# Trigger when brief markdown changes on main — weekly posts pushed by the Mac
# mini pipeline, or hand edits to content/brief/*.md (GitHub mobile included).
# Regenerate sites/v4/brief HTML → auto-deploy.
on:
  push:
    branches:
      - main
    paths:
      - 'content/brief/**'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Specific commit SHA to regenerate from (defaults to ref HEAD). Use to avoid races when chaining from another workflow.'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    # Prevent infinite loops on push events, but always run on workflow_dispatch
    # (mirrors content-update.yml's guard, in case a future pipeline dispatches
    # this after committing as github-actions[bot])
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Use a PAT or default token with write permissions
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pin to caller-supplied SHA when present (avoids races when chained from
          # another workflow — see deploy.yml for the same pattern). Falls back to
          # github.sha for push events and bare manual dispatches.
          ref: ${{ inputs.sha != '' && inputs.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          # Pinned to the version installed on the Mac mini so rendering is
          # identical in both places — the markdown lib's TOC heading-id
          # slugification has drifted across versions before.
          pip install markdown==3.10.3

      - name: Regenerate brief HTML
        run: |
          echo "=== Regenerating brief site ==="
          python3 infrastructure/regenerate_brief_html.py

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet sites/v4/brief/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit generated files
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pinning checkout to a SHA leaves us in detached HEAD; reattach to main
          # so the subsequent rebase + push have a tracking branch to work with.
          git checkout -B main
          git add sites/v4/brief
          git commit -m "chore: regenerate brief site from content update

          Auto-generated by brief-update pipeline.
          Triggered by: ${{ github.sha }}"

          git pull --rebase origin main
          git push origin HEAD:main

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Trigger deployment
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const sha = '${{ steps.commit.outputs.sha }}';
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                version: 'v4',
                sha
              }
            });
            console.log(`Triggered deploy.yml for v4 @ ${sha}`);
