<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Weekly Brief</title>
<meta name="description" content="AI Weekly Brief — vendor, Databricks, and regulatory AI news, compiled weekly.">
<style>
:root {
    --bg: #1a1a1a; --text: #e0e0e0; --muted: #888; --accent: #88dcb4;
    --border: #333;
    --font-stack: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
}
[data-theme="light"] { --bg: #fafafa; --text: #1a1a1a; --muted: #666; --accent: #278061; --border: #ddd; }
body { background-color: var(--bg); color: var(--text); font-family: var(--font-stack);
    font-size: 16px; line-height: 1.6; margin: 0; padding: 2rem; }
.container { max-width: 1100px; margin: 0 auto; }
h1 { font-size: 2rem; margin-top: 0; letter-spacing: -0.03em; }
a { color: var(--text); text-decoration: underline; text-decoration-color: var(--accent);
    text-decoration-thickness: 1px; text-underline-offset: 4px; }
a:hover { color: var(--accent); text-decoration-color: transparent; }
nav { margin: 1.5rem 0 2.5rem 0; padding: 1rem 0; border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border); }
.muted { color: var(--muted); }
</style>
</head>
<body>
<div class="container">
    <h1>AI Weekly Brief</h1>
    <nav><a href="https://fring.io">fring.io</a></nav>
    <p>Weekly AI industry, Databricks, and regulatory digest.</p>
    <p class="muted">First post lands Friday, August 21, 2026.</p>
</div>
</body>
</html>
